{% extends "lk/base.html" %}
{% block title %}Новое обращение{% endblock %}
{% block content %}
<div style="max-width:640px;margin:0 auto"><div class="card"><h3>Новое обращение</h3>
<form method="post" action="/lk/tickets/new">
<label>Тема</label><input name="subject" required placeholder="Например: не подключается услуга">
<label>Описание</label><textarea name="body" required style="min-height:120px" placeholder="Опишите: что делали, что произошло, когда."></textarea>
<button class="btn" type="submit">Отправить</button> <a class="btn secondary" href="/lk/tickets">Отмена</a>
</form></div></div>
{% endblock %}
