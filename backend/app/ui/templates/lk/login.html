{% extends "lk/base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<div style="max-width:420px;margin:40px auto"><div class="card">
<h3>Вход в кабинет</h3>
{% if error %}<p><span class="pill bad">{{ error }}</span></p>{% endif %}
<form method="post">
<label>Email</label><input name="email" type="email" required placeholder="you@example.com">
<label>Пароль</label><input name="password" type="password" required placeholder="Ваш пароль">
<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="remember" checked style="width:auto;margin:0"> Запомнить меня на 30 дней</label>
<button class="btn" type="submit" style="width:100%">Войти</button>
</form>
<p class="muted" style="text-align:center">Нет кабинета? <a href="/lk/register">Регистрация</a></p>
</div></div>
{% endblock %}
