<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Кабинет{% endblock %} · ITKAM34</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1117;color:#e6edf3;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px}
nav{position:sticky;top:0;background:#010409;border-bottom:1px solid #21262d;padding:8px 14px;display:flex;flex-wrap:wrap;gap:4px;z-index:10}
nav a{color:#9da7b3;text-decoration:none;padding:7px 11px;border-radius:9px;font-size:13px}
nav a:hover{background:#161b22;color:#fff}
nav a.home{color:#3fb950;font-weight:700}
main{max-width:1080px;margin:20px auto;padding:0 14px}
.card{background:#161b22;border:1px solid #30363d;border-radius:14px;padding:20px;margin-bottom:18px}
h1,h2,h3{margin:.2em 0 .5em}
.note,.muted{color:#8b949e;font-size:13px}
.grid{display:grid;gap:14px}.cols-2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.balance{font-size:34px;font-weight:800;color:#3fb950}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:#8b949e;text-align:left;font-weight:600;padding:8px;border-bottom:1px solid #30363d}
td{padding:8px;border-bottom:1px solid #21262d;vertical-align:middle}
.btn{display:inline-block;background:#238636;color:#fff;border:none;padding:8px 15px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;margin:2px}
.btn:hover{filter:brightness(1.1)}
.btn.secondary{background:#30363d;color:#e6edf3}
.btn.danger{background:#da3633}.btn.warn{background:#9e6a03}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
.pill.ok{background:rgba(35,134,54,.25);color:#3fb950}.pill.pause{background:rgba(158,106,3,.25);color:#d29922}
.pill.bad{background:rgba(218,54,51,.25);color:#f85149}.pill.info{background:rgba(56,139,253,.2);color:#58a6ff}
input,select,textarea{width:100%;background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:10px;padding:10px 12px;font-size:14px;margin:5px 0 12px}
label{font-size:12px;color:#8b949e;font-weight:600}
.neg{color:#f85149;font-weight:600}.pos{color:#3fb950;font-weight:600}
.qr{background:#fff;padding:14px;border-radius:12px;display:inline-block}
.qr svg{width:230px;height:230px;display:block}
.mono{font-family:ui-monospace,monospace;font-size:13px;background:#0d1117;border:1px solid #30363d;padding:12px;border-radius:10px;word-break:break-all}
.hero{background:linear-gradient(120deg,#0d1117,#16a34a 160%)}
footer{color:#8b949e;font-size:13px;text-align:center;padding:22px}
a{color:#58a6ff}
</style>
</head>
<body>
<nav>
  <a class="home" href="/">ITKAM34</a>
  {% if user %}
  <a href="/lk/">Кабинет</a><a href="/lk/order">Подключить</a><a href="/lk/tickets">Поддержка</a>{% if user and user.role in ("cashier", "admin") %}<a href="/lk/kassa">Касса</a>{% endif %}
  <a href="#" onclick="event.preventDefault();document.getElementById('logout-form').submit()">Выйти</a>
  {% else %}
  <a href="/lk/login">Вход</a><a href="/lk/register">Регистрация</a>
  {% endif %}
</nav>
<main>{% block content %}{% endblock %}</main>
<footer>ITKAM34 · облачные услуги с поминутной оплатой · вопросы — в «Поддержке»</footer>
{% if user %}<form id="logout-form" method="post" action="/lk/logout" style="display:none"></form>{% endif %}
</body>
</html>
