<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ITKAM34{% endblock %}</title>
<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#0f172a;color:#e2e8f0}
 header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:#1e293b}
 header a{color:#7dd3fc;text-decoration:none}
 main{padding:20px;max-width:960px;margin:0 auto}
 table{width:100%;border-collapse:collapse;background:#1e293b}
 th,td{padding:8px 10px;text-align:left;border-bottom:1px solid #334155;font-size:14px}
 .card{background:#1e293b;border-radius:10px;padding:16px;margin-bottom:16px}
 .money{font-size:28px;font-weight:700;color:#4ade80}
 button,input{padding:8px 12px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#e2e8f0}
 button{cursor:pointer}
 .st-active{color:#4ade80}.st-suspended{color:#f87171}.st-provisioning{color:#facc15}.st-terminated{color:#94a3b8}
 pre{background:#0f172a;padding:12px;border-radius:8px;overflow:auto;font-size:12px}
 h1{line-height:1.2}
</style>
</head>
<body>
<header>
  <a href="/"><strong>ITKAM34</strong></a>
  <span>
    {% if user %}
      {{ user.email }}
      <form method="post" action="/lk/logout" style="display:inline">
        <button type="submit">Выйти</button>
      </form>
    {% else %}
      <a href="/lk/login">Вход</a> · <a href="/lk/register">Регистрация</a>
    {% endif %}
  </span>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
