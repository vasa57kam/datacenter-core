<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Кабинет{% endblock %} · ITKAM34</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#0f172a;--muted:#64748b;--accent:#16a34a;--danger:#e11d48;--warn:#d97706;--radius:16px;--shadow:0 8px 24px rgba(15,23,42,.08)}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(120deg,#0f172a,#1e3a5f);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header .logo{font-weight:800;font-size:20px}
header nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
header nav a{color:#dbeafe;text-decoration:none;padding:8px 14px;border-radius:999px;font-size:14px}
header nav a:hover{background:rgba(255,255,255,.15);color:#fff}
main{max-width:1080px;margin:24px auto;padding:0 16px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:20px}
h1,h2,h3{margin:.2em 0 .5em}
.muted{color:var(--muted);font-size:14px}
.grid{display:grid;gap:16px}.cols-2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.balance{font-size:36px;font-weight:800;color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-weight:600;padding:8px;border-bottom:2px solid #e2e8f0}
td{padding:8px;border-bottom:1px solid #eef2f7;vertical-align:middle}
.btn{display:inline-block;background:var(--accent);color:#fff;border:none;padding:10px 18px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;margin:2px}
.btn:hover{filter:brightness(1.07)}
.btn.secondary{background:#e2e8f0;color:#0f172a}
.btn.danger{background:var(--danger)}
.btn.warn{background:var(--warn)}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
.pill.ok{background:#dcfce7;color:#166534}.pill.pause{background:#fef3c7;color:#92400e}.pill.bad{background:#ffe4e6;color:#9f1239}.pill.info{background:#e0f2fe;color:#075985}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:10px;font-size:14px;margin:6px 0 12px;background:#fff}
label{font-size:13px;color:var(--muted);font-weight:600}
.neg{color:var(--danger);font-weight:600}.pos{color:var(--accent);font-weight:600}
.qr{background:#fff;padding:14px;border-radius:12px;display:inline-block;border:1px solid #e2e8f0}
.qr svg{width:230px;height:230px;display:block}
.mono{font-family:ui-monospace,monospace;font-size:13px;background:#f1f5f9;padding:12px;border-radius:10px;word-break:break-all}
footer{color:var(--muted);font-size:13px;text-align:center;padding:24px}
.hero{background:linear-gradient(120deg,#0f172a,#16a34a 150%);color:#fff}
</style>
</head>
<body>
<header>
  <div class="logo">ITKAM34</div>
  <nav>
    {% if user %}
    <a href="/lk/">Кабинет</a><a href="/lk/order">Подключить</a><a href="/lk/tickets">Поддержка</a>
    <a href="#" onclick="event.preventDefault();document.getElementById('logout-form').submit()">Выйти</a>
    {% else %}
    <a href="/lk/login">Вход</a><a href="/lk/register">Регистрация</a>
    {% endif %}
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
<footer>ITKAM34 · облачные услуги с поминутной оплатой · вопросы — в «Поддержке»</footer>
{% if user %}<form id="logout-form" method="post" action="/lk/logout" style="display:none"></form>{% endif %}
</body>
</html>
