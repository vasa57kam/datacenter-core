{% extends "lk/base.html" %}
{% block title %}Подключение{% endblock %}
{% block content %}
<div class="card"><h3>Подключить услугу</h3>
<form method="post" action="/lk/order">
  <label>Тариф</label>
  <select name="product_id">{% for p in products %}<option value="{{ p.id }}" {% if pre == p.code %}selected{% endif %}>{{ p.name }} — {{ (p.price_minor/100)|round(2) }} ₽ {% if p.unit=='minute' %}/ мин{% elif p.unit=='second' %}/ сек{% elif p.unit=='gb' %}/ ГиБ{% elif p.unit=='month' %}/ мес{% else %}разово{% endif %}</option>{% endfor %}</select>
  <label>Сервер (необязательно)</label>
  <select name="node_id"><option value="0">Автовыбор (рекомендуем)</option>{% for n in nodes %}<option value="{{ n.id }}">{{ n.name }}</option>{% endfor %}</select>
  <label>Название услуги (необязательно)</label>
  <input name="name" placeholder="Например: мой канал">
  <button class="btn" type="submit">Подключить</button>
</form>
<p class="muted">Списание начинается с первой минуты/секунды фактического использования. Пауза и отказ — в кабинете.</p>
</div>
{% endblock %}
