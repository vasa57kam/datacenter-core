{% extends "lk/base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div style="max-width:420px;margin:40px auto"><div class="card">
<h3>Создать кабинет</h3>
{% if error %}<p><span class="pill bad">{{ error }}</span></p>{% endif %}
<form method="post">
<label>Email</label><input name="email" type="email" required placeholder="you@example.com">
<label>Пароль</label><input name="password" type="password" minlength="8" required placeholder="Минимум 8 символов">
<button class="btn" type="submit" style="width:100%">Зарегистрироваться</button>
</form>
<p class="muted" style="text-align:center">Уже есть кабинет? <a href="/lk/login">Вход</a></p>
</div></div>
{% endblock %}
