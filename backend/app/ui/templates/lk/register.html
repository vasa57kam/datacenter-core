{% extends "lk/base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="card" style="max-width:360px;margin:60px auto">
  <h2>Регистрация</h2>
  {% if error %}<p style="color:#f87171">{{ error }}</p>{% endif %}
  <form method="post" action="/lk/register">
    <p><input name="email" type="email" placeholder="Email" required style="width:100%"></p>
    <p><input name="password" type="password" placeholder="Пароль (минимум 8)" minlength="8" required style="width:100%"></p>
    <button type="submit">Создать аккаунт</button>
  </form>
</div>
{% endblock %}
