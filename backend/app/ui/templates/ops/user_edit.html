{% extends "ops/base_ops.html" %}
{% block title %}Пользователь{% endblock %}
{% block content %}
<div class="card" style="max-width:560px">
<h1>{{ 'Новый пользователь' if not u else 'Пользователь: ' + u.email }}</h1>
<form method="post">
  <label>Email</label><input name="email" value="{{ u.email if u else '' }}" required>
  <label>Роль</label>
  <select name="role"><option value="client" {% if u and u.role == 'client' %}selected{% endif %}>Клиент</option><option value="admin" {% if u and u.role == 'admin' %}selected{% endif %}>Админ</option></select>
  <label>Статус</label>
  <select name="status"><option value="active" {% if not u or u.status == 'active' %}selected{% endif %}>Активен</option><option value="blocked" {% if u and u.status == 'blocked' %}selected{% endif %}>Заблокирован</option></select>
  <label>Новый пароль (оставь пустым, чтобы не менять)</label><input name="new_password" type="password" placeholder="Минимум 8 символов">
  <button class="btn" type="submit">Сохранить</button> <a class="btn sec" href="/admin-ops/users">Отмена</a>
</form>
</div>
{% endblock %}
