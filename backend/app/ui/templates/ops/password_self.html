{% extends "ops/base_ops.html" %}
{% block title %}Смена своего пароля{% endblock %}
{% block content %}
<div class="card">
<h1>🔑 Сменить свой пароль</h1>
{% if error %}<div class="err">{{ error }}</div>{% endif %}
{% if ok %}<div class="ok">{{ ok }}</div>{% endif %}
<form method="post" action="/admin-ops/password">
<label>Текущий пароль</label>
<input type="password" name="current" required autocomplete="current-password">
<label>Новый пароль (минимум 8 символов)</label>
<input type="password" name="new" required minlength="8" autocomplete="new-password">
<label>Повторите новый пароль</label>
<input type="password" name="confirm" required minlength="8" autocomplete="new-password">
<p style="margin-top:18px"><button class="btn" type="submit">Сменить пароль</button></p>
</form>
</div>
{% endblock %}
