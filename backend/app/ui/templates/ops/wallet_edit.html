<!--theme146--><style>
:root{--bg:#0d1117;--panel:#161b22;--line:#21262d;--txt:#e6edf3;--mut:#9da7b3;--grn:#238636;--grn2:#3fb950;--yel:#d29922;--red:#da3633;--rad:12px}
body{background:var(--bg)!important;color:var(--txt)!important;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif!important;margin:0}
a{color:#58a6ff}
table{border-collapse:collapse;width:100%}
td,th{padding:8px 10px;border-bottom:1px solid var(--line);color:var(--mut);font-size:13px}
th{color:var(--txt);text-align:left}
button,input,select,textarea{border-radius:10px;border:1px solid var(--line);background:#0f141b;color:var(--txt);padding:9px 12px;font:inherit}
button{background:var(--grn);border:0;color:#fff;font-weight:600;cursor:pointer}
button:hover{filter:brightness(1.12)}
.card,section{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);padding:16px;margin:12px 0}
.invest-ads{border-color:var(--yel);background:linear-gradient(180deg,#161b22,#1a1710)}
.invest-ads a{color:var(--yel)}
.legal-links{margin:18px 0;color:var(--mut);font-size:13px}
.legal-links a{color:var(--mut)}
.quick-tiles a{margin-right:14px;color:var(--yel);text-decoration:none;font-weight:600}

.card{box-shadow:0 8px 24px #00000066}
h1{font-size:24px;margin:8px 0}h2{font-size:18px;margin:16px 0 8px}
a{text-decoration:none}a:hover{text-decoration:underline}
body{background:#0b0f14!important}
.topbar146{display:none}
</style>
{% extends "ops/base_ops.html" %}
{% block title %}Кошелёк{% endblock %}
{% block content %}
<div class="card" style="max-width:560px">
<h1>Кошелёк пользователя №{{ w.user_id }}</h1>
<form method="post">
  <label>Баланс, ₽</label><input name="balance_rub" value="{{ '%.2f' % (w.balance_minor / 100) }}">
  <label>Обещанный платёж (лимит минуса), ₽</label><input name="promise_rub" value="{{ '%.2f' % ((w.promise_limit_minor or 0) / 100) }}">
  <label>Автоподтверждение: личный лимит, ₽ (пусто = общий)</label>
  <input name="auto_limit_rub" value="{{ '' if w.auto_approve_limit_minor is none else '%.2f' % (w.auto_approve_limit_minor / 100) }}" placeholder="общий">
  <label>Автоподтверждение: сколько раз можно</label><input name="auto_uses" type="number" min="0" value="{{ w.auto_approve_max_uses or 1 }}">
  <label>Использовано автоподтверждений (сброс → 0)</label><input name="auto_used" type="number" min="0" value="{{ w.auto_approved_count or 0 }}">
  <button class="btn" type="submit">Сохранить</button> <a class="btn sec" href="/admin-ops/wallets">Отмена</a>
</form>
</div>
{% endblock %}
