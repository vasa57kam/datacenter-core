<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ITKAM34{% endblock %}</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0d1117;
    color: #e6edf3;
    line-height: 1.6;
  }
  header {
    background: #161b22;
    border-bottom: 1px solid #30363d;
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header a { color: #58a6ff; text-decoration: none; font-weight: 500; }
  header a:hover { text-decoration: underline; }
  header strong { font-size: 18px; color: #e6edf3; }
  main { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }
  
  .card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 24px;
  }
  .card h2, .card h3 {
    color: #e6edf3;
    margin-bottom: 16px;
    font-size: 20px;
    font-weight: 600;
  }
  .card h3 { font-size: 18px; }
  
  .money {
    font-size: 48px;
    font-weight: 700;
    color: #3fb950;
    margin: 8px 0;
  }
  .money-label {
    font-size: 14px;
    color: #8b949e;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 16px;
  }
  th {
    background: #0d1117;
    color: #8b949e;
    font-weight: 600;
    text-transform: uppercase;
    font-size: 12px;
    letter-spacing: 0.5px;
    padding: 12px 16px;
    text-align: left;
    border-bottom: 2px solid #30363d;
  }
  td {
    padding: 12px 16px;
    border-bottom: 1px solid #21262d;
    color: #e6edf3;
    font-size: 14px;
  }
  tr:hover td { background: #1c2128; }
  
  button, .btn {
    background: #238636;
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    display: inline-block;
    text-decoration: none;
  }
  button:hover, .btn:hover { background: #2ea043; }
  button.secondary, .btn.secondary { background: #21262d; color: #e6edf3; border: 1px solid #30363d; }
  button.secondary:hover, .btn.secondary:hover { background: #30363d; }
  button.danger, .btn.danger { background: #da3633; }
  button.danger:hover, .btn.danger:hover { background: #f85149; }
  
  input, select, textarea {
    background: #0d1117;
    border: 1px solid #30363d;
    color: #e6edf3;
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 14px;
    width: 100%;
    margin-bottom: 12px;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: #58a6ff;
  }
  label {
    display: block;
    margin-bottom: 8px;
    color: #8b949e;
    font-size: 14px;
    font-weight: 500;
  }
  
  .st-active { color: #3fb950; font-weight: 600; }
  .st-suspended { color: #f85149; font-weight: 600; }
  .st-provisioning { color: #d29922; font-weight: 600; }
  .st-pending { color: #d29922; font-weight: 600; }
  .st-closed { color: #8b949e; }
  .st-terminated { color: #8b949e; }
  
  pre {
    background: #0d1117;
    border: 1px solid #30363d;
    padding: 16px;
    border-radius: 6px;
    overflow-x: auto;
    font-family: 'SF Mono', Monaco, monospace;
    font-size: 13px;
    color: #e6edf3;
    margin: 12px 0;
  }
  
  .note {
    color: #8b949e;
    font-size: 13px;
    margin-top: 8px;
  }
  
  .hero {
    text-align: center;
    padding: 64px 24px;
  }
  .hero h1 {
    font-size: 48px;
    font-weight: 700;
    margin-bottom: 16px;
    background: linear-gradient(135deg, #58a6ff 0%, #3fb950 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .hero p {
    font-size: 18px;
    color: #8b949e;
    max-width: 600px;
    margin: 0 auto 32px;
  }
  
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 24px;
    margin-top: 32px;
  }
  
  .form-group { margin-bottom: 16px; }
  .form-row { display: flex; gap: 12px; align-items: flex-end; }
  .form-row > * { flex: 1; }
  
  h1 { font-size: 32px; margin-bottom: 24px; }
  h2 { font-size: 24px; margin-bottom: 16px; }
  
  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: #8b949e;
  }
  .empty-state a { color: #58a6ff; }
</style>
</head>
<body>
<header>
  <a href="/"><strong>ITKAM34</strong></a>
  <span>
    {% if user %}
      <a href="/lk/">Кабинет</a> · {{ user.email }}
      <form method="post" action="/lk/logout" style="display:inline">
        <button type="submit" class="secondary">Выйти</button>
      </form>
    {% else %}
      <a href="/lk/login" class="btn secondary">Вход</a>
      <a href="/lk/register" class="btn">Регистрация</a>
    {% endif %}
  </span>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
