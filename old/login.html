{% extends "lk/base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="card" style="max-width:400px;margin:64px auto">
  <h2>Вход в кабинет</h2>
  {% if error %}<p style="color:#f85149;margin-bottom:16px">{{ error }}</p>{% endif %}
  <form method="post" action="/lk/login">
    <label>Email</label>
    <input name="email" type="email" placeholder="you@example.com" required>
    <label>Пароль</label>
    <input name="password" type="password" placeholder="Минимум 8 символов" required>
    <label style="display:flex;align-items:center;gap:8px;margin:16px 0">
      <input type="checkbox" name="remember" value="on" checked style="width:auto;margin:0">
      Запомнить меня на 30 дней
    </label>
    <button type="submit" style="width:100%">Войти</button>
  </form>
  <p style="text-align:center;margin-top:16px">
    <a href="/lk/register">Нет аккаунта? Регистрация</a>
  </p>
</div>
{% endblock %}
