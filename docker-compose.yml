services:
  db:
    image: postgres:16-alpine
    container_name: billing-db
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-billing} -d ${POSTGRES_DB:-billing}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: billing-redis
    restart: unless-stopped

  api:
    build: ./backend
    container_name: billing-api
    restart: unless-stopped
    env_file: .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8008:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./backend
    container_name: billing-worker
    restart: unless-stopped
    env_file: .env
    command: python -m app.worker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  caddy:
    profiles: ["standalone"]
    image: caddy:2-alpine
    container_name: billing-caddy
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data

volumes:
  pgdata:
  caddydata:
